<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>GitHub Projects | Manohar T H</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="icon" href="./files/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
        :root {
            --primary: #2563eb;
            --accent: #ff6600;
            --bg: #f8fafc;
            --card-bg: #fff;
            --text: #1e293b;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background: #ffffff;
            box-shadow: 0 2px 14px rgba(37, 99, 235, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: #fff;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 24px 60px 24px;
        }

        .project-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .project-title h1 {
            font-size: 2.2rem;
            color: var(--text);
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .project-title h1 i {
            color: var(--accent);
        }

        .project-title p {
            color: var(--muted);
            font-size: 1.05rem;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
            width: 100%;
        }

        .project {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(37,99,235,0.08);
            padding: 26px 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: all 0.25s ease;
            min-height: 240px;
            border-left: 4px solid var(--primary);
            border-top: 1px solid #f1f5f9;
            border-right: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
        }

        .project:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(37,99,235,0.16);
            border-left-color: var(--accent);
        }

        .project h4 {
            font-size: 1.25rem;
            color: var(--text);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .project p {
            font-size: 0.95rem;
            color: var(--muted);
            margin-bottom: 16px;
            line-height: 1.5;
            flex-grow: 1;
        }

        .language-bar {
            display: flex;
            height: 7px;
            margin-top: 10px;
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
            background: #e2e8f0;
        }

        .language-bar div {
            height: 100%;
        }

        .language-names {
            display: flex;
            justify-content: flex-start;
            flex-wrap: wrap;
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 8px;
            gap: 8px;
        }

        .language-names span {
            font-weight: 600;
        }

        .project button {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 600;
            margin-top: 18px;
            cursor: pointer;
            font-size: 0.92rem;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .project button:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .project button a {
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px 16px;
            }
            .project-title h1 {
                font-size: 1.6rem;
            }
            .projects {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo">Manohar</a>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
        </div>
    </header>

    <section class="project-content" id="projects">
        <div class="container">
            <div class="project-title">
                <h1><i class="fa-brands fa-github"></i> Public GitHub Repositories</h1>
                <p>Real-time projects, cybersecurity tools, and software experiments loaded directly via GitHub API</p>
            </div>
            <div class="projects" id="projects-container">
                <div style="color:var(--primary);font-weight:600;grid-column:1/-1;text-align:center;padding:40px;">
                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top:12px;">Fetching repositories from GitHub...</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        const username = "cybmanuer";
        const projectsContainer = document.getElementById("projects-container");

        async function fetchRepositories() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos`);
                if (!response.ok) {
                    throw new Error(`GitHub API returned an error: ${response.statusText}`);
                }
                const repositories = await response.json();
                if (!Array.isArray(repositories)) {
                    throw new Error("Unexpected response format.");
                }

                // Sort by most recently updated
                repositories.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

                projectsContainer.innerHTML = "";

                for (const repo of repositories) {
                    try {
                        const languagesResponse = await fetch(repo.languages_url);
                        const languages = await languagesResponse.json();
                        const languageTotal = Object.values(languages).reduce((a, b) => a + b, 0) || 1;

                        const languagePercentages = Object.entries(languages).map(([lang, value]) => ({
                            lang,
                            percentage: ((value / languageTotal) * 100).toFixed(1),
                        }));

                        addProjectToDOM(repo, languagePercentages);
                    } catch (e) {
                        addProjectToDOM(repo, []);
                    }
                }
            } catch (error) {
                console.error("Error fetching repositories:", error);
                projectsContainer.innerHTML = `<div style="color:var(--accent);font-weight:600;grid-column:1/-1;text-align:center;">Could not fetch repositories: ${error.message}</div>`;
            }
        }

        function addProjectToDOM(repo, languagePercentages) {
            const projectDiv = document.createElement("div");
            projectDiv.classList.add("project");

            const languageBar = languagePercentages
                .map(
                    (lang) =>
                        `<div style="width:${lang.percentage}%; background-color:${getColorForLanguage(lang.lang)};" title="${lang.lang} (${lang.percentage}%)"></div>`
                )
                .join("");

            const languageNames = languagePercentages
                .map(
                    (lang) =>
                        `<span style="color:${getColorForLanguage(lang.lang)}">${lang.lang} (${lang.percentage}%)</span>`
                )
                .join("");

            projectDiv.innerHTML = `
                <h4>${repo.name}</h4>
                <p>${repo.description || "Open source project repository on GitHub."}</p>
                ${languagePercentages.length > 0 ? `<div class="language-bar">${languageBar}</div><div class="language-names">${languageNames}</div>` : ''}
                <button><a href="${repo.html_url}" target="_blank" rel="noopener"><i class="fab fa-github"></i> View on GitHub</a></button>
            `;

            projectsContainer.appendChild(projectDiv);
        }

        function getColorForLanguage(language) {
            const colors = {
                JavaScript: "#f1e05a",
                HTML: "#e34c26",
                CSS: "#563d7c",
                Python: "#3572A5",
                Java: "#b07219",
                C: "#555555",
                "C++": "#f34b7d",
                Ruby: "#701516",
                Go: "#00ADD8",
                PHP: "#4F5D95",
                TypeScript: "#3178c6",
                Shell: "#89e051",
                SCSS: "#c6538c",
                Jupyter: "#DA5B0B",
            };
            return colors[language] || "#2563eb";
        }

        fetchRepositories();
    </script>
</body>
</html>
