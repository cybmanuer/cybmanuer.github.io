
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Projects</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        :root {
            --primary: #2563eb;
            --accent: #ff6600;
            --bg: #f5f7fa;
            --card-bg: #fff;
            --text: #222;
            --muted: #666;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 16px 32px 16px;
        }

        .project-title {
            text-align: center;
            margin-bottom: 36px;
        }

        .project-title h4 {
            font-size: 2.2rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .project-title p {
            color: var(--muted);
            font-size: 1.08rem;
            margin-top: 8px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 32px;
            width: 100%;
        }

        .project {
            background: var(--card-bg);
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(37,99,235,0.08);
            padding: 32px 24px 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: transform 0.18s, box-shadow 0.18s;
            min-height: 260px;
            position: relative;
            border-bottom: 5px solid var(--primary);
        }

        .project:hover {
            transform: translateY(-8px) scale(1.025);
            box-shadow: 0 8px 28px rgba(255,102,0,0.12);
            border-bottom: 5px solid var(--accent);
        }

        .project h4 {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 10px;
            margin-top: 0;
        }

        .project p {
            font-size: 1.03rem;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .language-bar {
            display: flex;
            height: 8px;
            margin-top: 10px;
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
            background: #e8eaf6;
        }

        .language-bar div {
            height: 100%;
        }

        .language-names {
            display: flex;
            justify-content: flex-start;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
            gap: 10px;
        }

        .language-names span {
            text-align: center;
            font-weight: 500;
        }

        .project button {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-weight: 600;
            margin-top: 18px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s, color 0.2s;
            box-shadow: 0 2px 8px rgba(37,99,235,0.10);
        }

        .project button:hover {
            background: var(--accent);
            color: #fff;
        }

        .project button a {
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .project button a:hover {
            color: #fff;
        }

        /* Responsive design for smaller screens */
        @media (max-width: 900px) {
            .container {
                padding: 28px 4vw 24px 4vw;
            }
            .project-title h4 {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px 2vw 16px 2vw;
            }
            .project-title h4 {
                font-size: 1.15rem;
            }
            .project {
                padding: 18px 10px 16px 10px;
                min-height: 180px;
            }
        }
    </style>
</head>
<body>

    <section class="project-content" id="projects">
        <div class="container">
            <div class="project-title">
                <h4><i class="fa-solid fa-folder-open"></i> My Projects On Github</h4>
                <p>Feel free to explore, but don’t take them seriously just yet!&#128517;</p>
            </div>
            <div class="projects" id="projects-container">
                <!-- Projects will be dynamically inserted here -->
            </div>
        </div>
    </section>

    <script>
        const username = "cybmanuer";
        const projectsContainer = document.getElementById("projects-container");

        // Function to fetch repository data
        async function fetchRepositories() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos`);
                if (!response.ok) {
                    throw new Error(`GitHub API returned an error: ${response.statusText}`);
                }
                const repositories = await response.json();
                if (!Array.isArray(repositories)) {
                    throw new Error("Unexpected response format: Repositories data is not an array.");
                }

                // Sort by most recently updated
                repositories.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

                for (const repo of repositories) {
                    // Fetch language breakdown for each repository
                    const languagesResponse = await fetch(repo.languages_url);
                    const languages = await languagesResponse.json();
                    const languageTotal = Object.values(languages).reduce((a, b) => a + b, 0);

                    // Calculate language percentages
                    const languagePercentages = Object.entries(languages).map(([lang, value]) => ({
                        lang,
                        percentage: ((value / languageTotal) * 100).toFixed(1),
                    }));

                    // Add project to the container
                    addProjectToDOM(repo, languagePercentages);
                }
            } catch (error) {
                console.error("Error fetching repositories:", error);
                projectsContainer.innerHTML = `<div style="color:var(--accent);font-weight:600;">An error occurred while fetching repositories: ${error.message}</div>`;
            }
        }

        // Function to dynamically add a project to the DOM
        function addProjectToDOM(repo, languagePercentages) {
            const projectDiv = document.createElement("div");
            projectDiv.classList.add("project");

            // Create language bar
            const languageBar = languagePercentages
                .map(
                    (lang) =>
                        `<div style="width:${lang.percentage}%; background-color:${getColorForLanguage(lang.lang)};" title="${lang.lang} (${lang.percentage}%)"></div>`
                )
                .join("");

            // Create language names below the language bar
            const languageNames = languagePercentages
                .map(
                    (lang) =>
                        `<span style="color:${getColorForLanguage(lang.lang)}">${lang.lang}</span>`
                )
                .join("");

            projectDiv.innerHTML = `
                <h4>${repo.name}</h4>
                <p>${repo.description || "No description available."}</p>
                <div class="language-bar">${languageBar}</div>
                <div class="language-names">${languageNames}</div>
                <button><a href="${repo.html_url}" target="_blank"><i class="fab fa-github"></i> View on GitHub</a></button>
            `;

            projectsContainer.appendChild(projectDiv);
        }

        // Function to get color for programming languages
        function getColorForLanguage(language) {
            const colors = {
                JavaScript: "#f1e05a",
                HTML: "#e34c26",
                CSS: "#563d7c",
                Python: "#3572A5",
                Java: "#b07219",
                C: "#555555",
                Ruby: "#701516",
                Go: "#00ADD8",
                PHP: "#4F5D95",
                TypeScript: "#3178c6",
                Shell: "#89e051",
                SCSS: "#c6538c",
                Jupyter: "#DA5B0B",
                // Add more languages and colors as needed
            };
            return colors[language] || "#ccc";
        }

        // Fetch repositories on page load
        fetchRepositories();
    </script>
</body>
</html>
